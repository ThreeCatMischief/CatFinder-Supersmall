<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 900 270" width="900" height="270" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A6F66"/></marker>
    <!-- tank from above, driving up -->
    <g id="tank">
      <rect x="-34" y="-46" width="16" height="92" rx="8" fill="#3A3A3A"/>
      <rect x="18" y="-46" width="16" height="92" rx="8" fill="#3A3A3A"/>
      <rect x="-20" y="-40" width="40" height="80" rx="6" fill="#F26B1D"/>
      <rect x="-9" y="-50" width="18" height="14" rx="3" fill="#2B2622"/>
    </g>
  </defs>
  <rect y="30" width="900" height="270" rx="24" fill="#FFF6EC"/>

  <!-- curves right -->
  <path d="M150,235 Q150,90 260,60" fill="none" stroke="#7A6F66" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <use href="#tank" x="150" y="230"/>
  <text x="330" y="120" font-size="17" font-weight="700" fill="#2B2622">Curves to the right?</text>
  <text x="330" y="146" font-size="15" fill="#7A6F66">The left wheel is faster.</text>
  <rect x="330" y="164" width="44" height="34" rx="8" fill="#F26B1D"/>
  <text x="352" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">+</text>
  <text x="386" y="187" font-size="15" fill="#2B2622">slows the left wheel</text>

  <!-- curves left -->
  <path d="M630,235 Q630,90 520,60" fill="none" stroke="#7A6F66" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <use href="#tank" x="630" y="230"/>
  <text x="690" y="120" font-size="17" font-weight="700" fill="#2B2622">Curves left?</text>
  <text x="690" y="146" font-size="15" fill="#7A6F66">The right wheel is faster.</text>
  <rect x="690" y="164" width="44" height="34" rx="8" fill="#2E5BD8"/>
  <text x="712" y="188" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">−</text>
  <text x="746" y="187" font-size="15" fill="#2B2622">slows the right wheel</text>
</svg>
