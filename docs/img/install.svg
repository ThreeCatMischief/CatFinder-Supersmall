<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="340" rx="24" fill="#FFF6EC"/>

  <!-- ESP32-CAM on the MB adapter -->
  <g transform="translate(60,70)">
    <rect x="0" y="40" width="170" height="130" rx="8" fill="#2E7D4F"/>
    <rect x="62" y="160" width="46" height="22" rx="4" fill="#B8B8B8"/>
    <rect x="18" y="0" width="134" height="120" rx="8" fill="#1F2A44"/>
    <circle cx="85" cy="56" r="28" fill="#2B3A5C"/><circle cx="85" cy="56" r="15" fill="#0B0F1A"/><circle cx="91" cy="50" r="4" fill="#5B7BE0"/>
    <text x="85" y="108" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ESP32-CAM</text>
    <text x="85" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ESP32-CAM-MB</text>
  </g>
  <text x="145" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#2B2622">Board on the USB adapter</text>
  <text x="145" y="322" text-anchor="middle" font-size="14" fill="#7A6F66">use a USB data cable</text>

  <!-- cable -->
  <path d="M145,254 Q145,266 165,266 L310,266 Q330,266 330,240 L330,200 L352,200" fill="none" stroke="#2B2622" stroke-width="6" stroke-linecap="round"/>

  <!-- laptop -->
  <g transform="translate(350,40)">
    <rect x="0" y="0" width="480" height="230" rx="14" fill="#2B2622"/>
    <rect x="12" y="12" width="456" height="206" rx="6" fill="#FFFFFF"/>
    <rect x="12" y="12" width="456" height="30" rx="6" fill="#EDE7E1"/>
    <circle cx="30" cy="27" r="5" fill="#E53935"/><circle cx="46" cy="27" r="5" fill="#F2B21D"/><circle cx="62" cy="27" r="5" fill="#2EA44F"/>
    <rect x="80" y="18" width="300" height="18" rx="9" fill="#FFFFFF"/>
    <text x="92" y="31" font-size="11" fill="#7A6F66">espressif.github.io/esptool-js</text>
    <text x="30" y="70" font-size="16" font-weight="700" fill="#2B2622">ESP Tool</text>

    <rect x="30" y="84" width="96" height="30" rx="6" fill="#2E5BD8"/>
    <text x="78" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Connect</text>

    <text x="30" y="142" font-size="12" fill="#7A6F66">Flash Address</text>
    <rect x="30" y="148" width="90" height="26" rx="4" fill="#FFFFFF" stroke="#C9BEB4"/>
    <text x="40" y="166" font-size="13" font-family="Menlo, monospace" fill="#2B2622">0x0</text>
    <text x="140" y="142" font-size="12" fill="#7A6F66">File</text>
    <rect x="140" y="148" width="250" height="26" rx="4" fill="#FFFFFF" stroke="#C9BEB4"/>
    <text x="150" y="166" font-size="12" fill="#2B2622">catfinder-1.0.0-factory.bin</text>

    <rect x="30" y="184" width="96" height="26" rx="6" fill="#2EA44F"/>
    <text x="78" y="202" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Program</text>

    <!-- step badges -->
    <g font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <circle cx="142" cy="99" r="12" fill="#F26B1D"/><text x="142" y="104">1</text>
      <circle cx="408" cy="161" r="12" fill="#F26B1D"/><text x="408" y="166">2</text>
      <circle cx="142" cy="197" r="12" fill="#F26B1D"/><text x="142" y="202">3</text>
    </g>
    <rect x="-20" y="230" width="520" height="14" rx="7" fill="#4A423C"/>
  </g>
  <text x="590" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#2B2622">Chrome or Edge on a computer</text>
</svg>
