; CatFinder Supersmall firmware for the AI Thinker ESP32-CAM.
; WiFi is set up at runtime through the setup hotspot; no credentials are compiled in.
;
;   pio run -t upload -t monitor     first install over USB (ESP32-CAM-MB adapter)
;   pio run -e ota -t upload         update over WiFi (POST /update)

[platformio]
default_envs = esp32cam
src_dir = firmware/src

[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32cam
framework = arduino
; The board default huge_app.csv has a single app slot; updates over WiFi need two.
board_build.partitions = min_spiffs.csv
; 160 MHz instead of 240: idle drops to 80 MHz, and 80 <-> 160 only changes a divider.
; 240 runs the PLL at a different frequency, and switching it off and on under WiFi is risky.
board_build.f_cpu = 160000000L
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=2

; Update a running robot over WiFi. Change upload_port to its IP address if
; catfinder.local does not resolve on your computer.
[env:ota]
extends = env:esp32cam
upload_protocol = custom
upload_port = catfinder.local
upload_command = curl --fail-with-body -sS -H "Content-Type: application/octet-stream" --data-binary @$SOURCE http://$UPLOAD_PORT/update
