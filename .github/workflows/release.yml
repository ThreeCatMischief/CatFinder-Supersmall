# On a tag vX.Y.Z: build the firmware and the Android app and attach them to a GitHub
# release. The APK is signed with your key if the four ANDROID_* secrets are set
# (see README, "Releasing"); otherwise it is a debug build.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Build
        run: |
          export PLATFORMIO_BUILD_FLAGS="-DFW_VERSION=\\\"${GITHUB_REF_NAME#v}\\\""
          pio run -e esp32cam
      - name: Collect images
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp .pio/build/esp32cam/firmware.bin "out/catfinder-$v.bin"
          cp .pio/build/esp32cam/firmware.factory.bin "out/catfinder-$v-factory.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew testDebugUnitTest
      - name: Build signed release
        if: env.KEYSTORE_BASE64 != ''
        env:
          CATFINDER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CATFINDER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CATFINDER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CATFINDER_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/CatFinder.apk "../CatFinder-${GITHUB_REF_NAME#v}.apk"
      - name: Build debug
        if: env.KEYSTORE_BASE64 == ''
        run: |
          ./gradlew assembleDebug -PappVersion="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/CatFinder.apk "../CatFinder-${GITHUB_REF_NAME#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: CatFinder-*.apk

  publish:
    needs: [firmware, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
